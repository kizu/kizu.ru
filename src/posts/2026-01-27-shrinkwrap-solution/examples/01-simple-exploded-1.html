<style>
  .explode {
    & .shrinkwrap {
      anchor-name: --explode-root;
      /* The overflow is not _necessary_ on the shrinkwrap, but it helps with overflow when the content spills out, so its ok to override it on the examples. */
      overflow: visible;

      background: color-mix(in oklch,
        var(--GREEN) calc(100% * var(--explode-opacity)),
        transparent
      );
      /* Not sure why this is offset lol */
      --explode-level: 1.3;
    }

    & .shrinkwrap-content {
      anchor-name: --explode-content;
      --explode-level: 3;
      opacity: calc(var(--explode-opacity) * 1.5);
    }
  }

  .expl0 {
    position-anchor: --explode-root;
    --explode-note: 'shrinkwrap';
    --explode-note-position: var(--explode--top);
  }

  .expl1 {
    position-anchor: --explode-content;
    --explode-note: 'shrinkwrap-content';
    --explode-level: 2;

    @container (width < 400px) {
      --explode-note-position: var(--explode--top);
    }
  }

  .expl2 {
    position-anchor: --_sw-source;
    --explode-note: 'shrinkwrap-probe';
    --explode-level: 3.4;
  }

  .fieldsets:has(> * > .controls > label > [id$='3d-view']:not(:checked)) + .explode {
    --explode-state: var(--explode--off);
  }

  .fieldsets:has(> * > .controls > label:nth-of-type(1) > [name$='selected']:checked) + .explode {
    & .expl0,
    & .expl0::before {
      z-index: 1;
      opacity: 1;
    }

    & .shrinkwrap {
      background: var(--GREEN);
    }
  }

  .fieldsets:has(> * > .controls > label:nth-of-type(2) > [name$='selected']:checked) + .explode {
    & .expl1 {
      background: color-mix(in oklch, var(--PINK), transparent);
    }

    & .expl1,
    & .expl1::before {
      z-index: 1;
      opacity: 1;
    }
  }

  .fieldsets:has(> * > .controls > label:nth-of-type(3) > [name$='selected']:checked) + .explode {
    & .expl2,
    & .expl2::before {
      opacity: 1;
    }

    & .shrinkwrap-content {
      z-index: 1;
      opacity: 1;
    }

    & .shrinkwrap-probe {
      z-index: -1;
      background: color-mix(in oklch, var(--PINK), transparent);
    }
  }

  .fieldsets:has(> * > .controls > label.shrinkwrap-controls > :checked) + * .shrinkwrap {
    --sw-enabled: var(--sw-enabled--off);
  }

  .fieldsets:has(> * > .controls > label.balance-controls > :checked) + * .shrinkwrap {
    text-wrap: auto;
  }

</style>
<div class="fieldsets">
  <div style="display: contents">
    <fieldset class="controls" style="margin-bottom: 0.5rem;">
      <legend>3D view</legend>
      <label><input id="exploded1-3d-view" type="checkbox" checked/> Show in 3D</label>
    </fieldset>
  </div>
  <details>
    <summary><span class="Link Link--pseudo">Extra options</span></summary>
    <fieldset class="controls" style="margin-bottom: 0.5rem;">
      <legend>Selected Element</legend>
      <label><input name="exploded1-selected" type="radio" checked/> shrinkwrap</label>
      <label><input name="exploded1-selected" type="radio"/> shrinkwrap-content</label>
      <label><input name="exploded1-selected" type="radio"/> shrinkwrap-probe</label>
    </fieldset>
    <fieldset class="controls" style="margin-bottom: 0.5lh;">
      <legend>Miscellaneous</legend>
      <label class="shrinkwrap-controls"><input type="checkbox" /> Disable the shrinkwrap technique</label>
      <label class="balance-controls"><input type="checkbox" /> Disable the <code>text-wrap: balance</code></label>
    </fieldset>
  </details>
</div>
<div class="explode">
  <h5 class="shrinkwrap">
    <span class="shrinkwrap-content">
      <span class="shrinkwrap-source">I am a Longer Header; I Will Wrap & Look Bad! <span style="display: var(--initial-at-large, none)">Oh no! What Can We Do?</span></span>
      <span class="shrinkwrap-probe"></span>
    </span>
  </h5>
  <div class="explode-note expl0"></div>
  <div class="explode-note expl1"></div>
  <div class="explode-note expl2"></div>
</div>
